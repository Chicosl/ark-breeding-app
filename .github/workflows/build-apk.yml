name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Nada é liberado por padrão; cada job pede só o que precisa.
permissions: {}

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  # 1) Compila o APK SEM assinatura. Este job roda código de terceiros (npm, Gradle),
  #    por isso não recebe senha, chave nem permissão de escrita.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências (versões travadas, sem scripts)
        run: npm ci --ignore-scripts

      - name: Marcar a versão no app
        run: sed -i "s/__APPVER__/$APP_VERSION/g" www/app.js

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Código nativo (leitura de foto com Google ML Kit e backup)
        run: |
          cp native/*.java android/app/src/main/java/com/chicosl/breedingcompanion/
          printf "\ndependencies {\n    implementation 'com.google.mlkit:text-recognition:16.0.1'\n}\n" >> android/app/build.gradle
          # Android 11+: permite enxergar o app de câmera (botão "Câmera" abre a câmera direto)
          sed -i 's#<application#<queries>\n        <intent>\n            <action android:name="android.media.action.IMAGE_CAPTURE" />\n        </intent>\n    </queries>\n\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "IMAGE_CAPTURE" android/app/src/main/AndroidManifest.xml

      - name: Ícone e tela de abertura
        run: |
          RES=android/app/src/main/res
          find $RES -name 'splash.png' -delete
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_foreground.xml
          cp -r icones/res/* $RES/
          if grep -q "Theme.SplashScreen" $RES/values/styles.xml; then
            sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">\#10171B</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>#' $RES/values/styles.xml
          fi

      - name: Número da versão
        run: |
          cat >> android/app/build.gradle <<GRADLE

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "$APP_VERSION"
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          GRADLE

      - name: Compilar APK (sem assinatura)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-sem-assinatura
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1

  # 2) Assina. Só este job vê a chave e a senha, e ele não executa npm nem Gradle.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      oficial: ${{ steps.assinar.outputs.oficial }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            assinatura
            pagina

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-sem-assinatura

      - name: Assinar
        id: assinar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/assinatura.jks"
          if [ -n "$KS_PASS" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"; ALIAS=breedingcompanion; OFICIAL=true
          elif [ -n "$KS_PASS" ] && [ -f assinatura/release.jks ]; then
            echo "::warning::Usando a chave da pasta assinatura/ (transição). Cadastre o segredo KEYSTORE_B64."
            cp assinatura/release.jks "$KS"; ALIAS=breedingcompanion; OFICIAL=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$KS_PASS" ]; then
            echo "::error::Falta o segredo KEYSTORE_PASSWORD."; exit 1
          else
            echo "::warning::Sem chave oficial: gerando APK de teste com chave descartável (não publicado)."
            KS_PASS=$(openssl rand -hex 24); ALIAS=teste; OFICIAL=false
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias teste -keyalg RSA -keysize 2048 -validity 30 -dname "CN=teste" -storepass "$KS_PASS" -keypass "$KS_PASS" >/dev/null 2>&1
          fi
          export KS_PASS
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out breeding-companion.apk alinhado.apk
          rm -f "$KS" alinhado.apk
          "$BT/apksigner" verify --print-certs breeding-companion.apk | tee assinatura.txt
          if [ "$OFICIAL" = true ]; then
            grep -qi "00fb5894c1bf762007d3ec54d85c8b054ea38d7c3308928ebe624555ef61323a" assinatura.txt
          fi
          echo "oficial=$OFICIAL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeding-companion-apk
          path: breeding-companion.apk

      - name: Preparar página de download
        if: steps.assinar.outputs.oficial == 'true'
        run: |
          mkdir -p site
          cp pagina/* site/
          cp breeding-companion.apk site/
          sed -i "s/__APPVER__/$APP_VERSION/g" site/index.html

      - name: Enviar página de download
        if: steps.assinar.outputs.oficial == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # 3) Publica o APK em Releases (único job com escrita no repositório).
  release:
    needs: sign
    if: needs.sign.outputs.oficial == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: breeding-companion-apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Breeding Companion ${{ env.APP_VERSION }}
          body_path: .github/release-notes.md
          files: breeding-companion.apk
          make_latest: true

  # 4) Atualiza a página de download (GitHub Pages).
  pagina:
    needs: sign
    if: needs.sign.outputs.oficial == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
