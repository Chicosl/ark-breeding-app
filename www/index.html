<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Breeding Companion para ARK</title>
<style>
/* fontes embutidas no app (licença OFL) — nada é baixado do Google */
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/inter-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/inter-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/rajdhani-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/rajdhani-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/rajdhani-latin-700-normal.woff2") format("woff2")}
</style>
<style>
:root{
  --bg:#0e1316; --bg2:#151c20; --card:#1b2429; --line:#2a363d; --txt:#e6ece9; --mut:#8fa1a6;
  --amber:#f2a93b; --amber2:#ffcf7a; --teal:#4fc3b0; --purple:#b48cff; --blue:#6fb3ff; --red:#ff6b6b; --pink:#ff8fc4;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,sans-serif}
body{padding-bottom:76px}
h1,h2,h3,.disp{font-family:Rajdhani,Inter,sans-serif;letter-spacing:.3px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1316 70%,#0e131600);padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px;margin:0;font-weight:700}
.brand h1 span{color:var(--amber)}
.sync{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--teal)} .dot.warn{background:var(--amber)} .dot.err{background:var(--red)}
main{padding:4px 14px 20px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#10171bf2;border-top:1px solid var(--line);display:flex;backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;padding:9px 4px 11px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--amber)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1205}
.btn.ghost{background:none}
.btn.danger{color:var(--red);border-color:#5a2a2a}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:600}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;background:none;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 0 0 1px var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.ccard{cursor:pointer}
.ctop{display:flex;align-items:baseline;gap:8px}
.cname{font-family:Rajdhani;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{font-weight:700}.sx.m{color:var(--blue)}.sx.f{color:var(--pink)}
.lvl{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
.tag.dead{color:var(--red)}
.grp{font-family:Rajdhani;font-size:15px;color:var(--amber);margin:18px 2px 0;display:flex;justify-content:space-between}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.bar{background:var(--bg2);border-radius:8px;padding:5px 7px;border:1px solid transparent}
.bar .k{font-size:10px;color:var(--mut);letter-spacing:.5px}
.bar .v{font-family:Rajdhani;font-weight:700;font-size:17px;line-height:1.1}
.bar .v small{color:var(--purple);font-size:12px;margin-left:2px}
.bar.top{border-color:var(--amber);background:#2a2214}
.bar.top .v{color:var(--amber2)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty b{display:block;color:var(--txt);font-family:Rajdhani;font-size:20px;margin-bottom:6px}
/* form */
.stgrid{display:grid;grid-template-columns:1fr 62px 62px 62px;gap:6px 6px;align-items:center;margin-top:6px}
.stgrid .h{font-size:11px;color:var(--mut);text-align:center}
.stgrid .h.s{color:var(--teal)}.stgrid .h.m{color:var(--purple)}.stgrid .h.j{color:var(--amber)}
.stgrid .nm{font-weight:600;font-size:14px}
.stgrid .nm small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.stgrid input{padding:10px 4px;text-align:center;font-family:Rajdhani;font-size:18px;font-weight:700}
.stgrid input.s{border-color:#244a44}.stgrid input.m{border-color:#3d3060}.stgrid input.j{border-color:#4d3a1a}
.stgrid .na{text-align:center;color:#3c4a50}
.vgrid{display:grid;grid-template-columns:1fr 118px 104px;gap:6px;align-items:center;margin-top:6px}
.vgrid .h{font-size:11px;color:var(--mut);text-align:center}
.vgrid .nm{font-weight:600;font-size:14px}
.vin{position:relative}.vin input{padding:10px 22px 10px 10px;text-align:right;font-family:Rajdhani;font-size:17px;font-weight:700}
.vin span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}
.res{font-family:Rajdhani;font-weight:700;font-size:15px;text-align:center;border-radius:9px;padding:6px 2px;min-height:38px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:#3c4a50}
.res .s{color:var(--teal)}.res .j{color:var(--amber)}
.vgrid input.miss,.stgrid input.miss{border-color:var(--red)!important;box-shadow:0 0 0 2px #ff6b6b44}
.res.q{border-color:#2f6b5f;color:var(--txt)}
.res.ok{border-color:#2f6b5f;background:#13241f;color:var(--txt)}
.res.amb{border-color:#8a6420;background:#2a2214;color:var(--amber2);cursor:pointer}
.res.bad{border-color:#6b2f2f;background:#2a1616;color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin:-2px 0 6px}
.opt{display:inline-flex;gap:8px;background:var(--card);border:1px solid #8a6420;border-radius:10px;padding:7px 10px;font-family:Rajdhani;font-weight:700;font-size:15px;cursor:pointer}
.msg{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.msg.ok{background:#13241f;border:1px solid #2f6b5f;color:#bfeee2}
.msg.warn{background:#2b2214;border:1px solid #5a4520;color:#f6d79c}
.msg.err{background:#2a1616;border:1px solid #6b2f2f;color:#ffc2c2}
.cdots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.cdot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0006;box-shadow:inset 0 0 0 1px #ffffff22}
.cdot.none{background:repeating-linear-gradient(45deg,#2a363d,#2a363d 2px,#1b2429 2px,#1b2429 4px)}
.cgrid{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:center;margin-top:6px}
.cswatch{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.cswatch.none{background:repeating-linear-gradient(45deg,#2a363d,#2a363d 4px,#1b2429 4px,#1b2429 8px)}
.cgrid .rn{font-size:14px;font-weight:600}.cgrid .rn small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.cgrid input{text-align:center;font-family:Rajdhani;font-weight:700;font-size:17px;padding:9px 4px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px;max-height:56vh;overflow:auto}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px;cursor:pointer;font-size:11px;color:var(--mut)}
.pick button i{display:block;height:34px;border-radius:7px;margin-bottom:3px}
.pick button b{color:var(--txt);font-family:Rajdhani;font-size:14px}
.tblwrap{overflow-x:auto;margin:8px -14px 0;padding:0 14px}
table.lib{border-collapse:separate;border-spacing:0 4px;min-width:100%;font-size:13px}
table.lib th{position:sticky;top:0;font-size:10.5px;letter-spacing:.4px;text-align:center;padding:4px 3px;border:0;color:var(--mut);white-space:nowrap}
table.lib th:first-child{text-align:left}
table.lib td{padding:7px 5px;border:0;text-align:center;background:var(--card);white-space:nowrap}
table.lib tr td:first-child{border-radius:9px 0 0 9px;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:1;font-weight:600}
table.lib tr td:last-child{border-radius:0 9px 9px 0}
table.lib td.lv{font-family:Rajdhani;font-weight:700;font-size:16px;min-width:40px;color:#fff}
table.lib td.lv small{color:#e6d4ff;font-size:11px}
table.lib td.lv.top{box-shadow:inset 0 0 0 2px var(--amber2)}
table.lib tr{cursor:pointer}
.cimg{opacity:0;transition:opacity .25s;display:block}.cimg.on{opacity:1}
.thumb{width:58px;height:58px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 45%,#26343b,#161e22);overflow:hidden;margin:-2px 2px -2px -2px}
.thumb img{width:100%;height:100%;object-fit:contain}
.hero{height:210px;border-radius:16px;background:radial-gradient(circle at 50% 50%,#2a3a42,#141b1f 70%);display:flex;align-items:center;justify-content:center;margin:4px 0 12px}
.hero img{max-height:205px;max-width:100%}
.prev{height:170px;border-radius:14px;background:radial-gradient(circle at 50% 50%,#2a3a42,#141b1f 70%);display:flex;align-items:center;justify-content:center;margin-top:8px}
.prev img{max-height:165px;max-width:100%}
.ccard .chead{display:flex;gap:10px;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.paste{margin-top:8px;border:1px dashed #3a4a54;border-radius:10px;padding:10px;font-size:13px;color:var(--mut);text-align:center;outline:none;min-height:40px}
.paste:focus{border-color:var(--amber);color:var(--txt)}
.pair{cursor:pointer}
.pair .who{display:flex;gap:8px;align-items:center;font-weight:600}
.pair .x{color:var(--mut)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.kid{background:var(--bg2);border-radius:8px;padding:5px 7px;border:1px solid transparent}
.kid .k{font-size:10px;color:var(--mut)}.kid .v{font-family:Rajdhani;font-weight:700;font-size:17px}
.kid .v small{color:var(--purple);font-size:12px}
.kid.top{border-color:var(--amber);background:#2a2214}.kid.top .v{color:var(--amber2)}
.stats3{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}
.stats3 b{color:var(--txt);font-family:Rajdhani;font-size:16px}
.chip.small{font-size:12px;padding:5px 10px}
.sp-res{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--bg2)}
.sp-res div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sp-res div:last-child{border:0}
.sp-res small{color:var(--mut)}
.picked{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--amber);border-radius:10px;padding:10px 12px}
.picked b{font-family:Rajdhani;font-size:18px}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.photo{display:flex;gap:10px;align-items:center;background:#18222a;border:1px dashed #3a4a54;border-radius:12px;padding:12px;margin-top:12px}
.photo svg{flex:none;width:28px;height:28px;color:var(--amber)}
.sticky-save{margin-top:18px;display:flex;gap:8px}
.sticky-save .btn{flex:1;padding:14px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid #222c31;vertical-align:top}
td.num{font-family:Rajdhani;font-weight:700;font-size:17px;white-space:nowrap}
td .who{font-size:12px;color:var(--mut)}
.big{font-family:Rajdhani;font-size:30px;font-weight:700;color:var(--amber2)}
/* sheet */
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:16px 16px 26px}
.sheet.center{border-radius:18px;margin:20px;max-width:420px}
.ov.c{align-items:center}
.kv{display:grid;grid-template-columns:1fr auto auto auto auto;gap:4px 10px;font-size:14px;align-items:center}
.kv .h{font-size:11px;color:var(--mut)}
.kv .n{font-family:Rajdhani;font-weight:700;font-size:16px;text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#263238;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--amber)}
.muted{color:var(--mut)}
.warnbox{background:#2b2214;border:1px solid #5a4520;color:#f6d79c;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.vgrid input.unsure{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.h1sub{display:block;font-size:10px;font-weight:500;letter-spacing:.3px;opacity:.6;margin-top:1px}
.aboutlist{margin:6px 0 0;padding-left:18px}.aboutlist li{margin:3px 0}
</style>
</head>
